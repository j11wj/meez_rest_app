name: meez_res_app
description: "Meez Restaurant POS App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & API
  http: ^1.2.1

  # Socket.IO realtime
  socket_io_client: ^2.0.3+1

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.2.3

  # Image / receipt printing
  screenshot: ^3.0.0
  printing: ^5.13.1
  pdf: ^3.11.1
  path_provider: ^2.1.3

  # UI helpers
  intl: ^0.19.0
  flutter_spinkit: ^5.2.1

  # Notification + sound + vibration
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.1.0
  vibration: ^2.0.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
